# Secrets required: RELEASE_TOKEN (so the opened PR triggers Build/Check workflows).
name: Mise update
on:
  schedule:
    # Weekly, matching the Dependabot cadence in .github/dependabot.yaml.
    - cron: "0 9 * * 2"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bump:
    name: ⬆️ Bump mise-managed JDKs
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🔧 Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: false
      - name: ⬆️ Bump the lockfile
        run: mise lock --bump
      - name: 📝 Open a PR if the lockfile changed
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if git diff --quiet -- mise.lock; then
            echo "No JDK updates available."
            exit 0
          fi

          BRANCH="mise-update-$(date +%Y%m%d)"
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -b "$BRANCH"
          git add mise.lock
          git commit -m "⬆️ build(deps): bump mise-managed JDKs"
          git push --set-upstream origin "$BRANCH"

          gh pr create \
            --title "⬆️ build(deps): bump mise-managed JDKs" \
            --body "Weekly refresh of mise.lock within the versions pinned in mise.toml." \
            --head "$BRANCH"
