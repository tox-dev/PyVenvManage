name: Mise update
on:
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bump:
    name: ⬆️ Bump mise-managed JDKs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🔧 Set up mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: false
          cache: false
      - name: ⬆️ Bump the lockfile
        run: mise lock --bump
      - name: Check the lockfile
        id: changed
        run: |
          if git diff --quiet -- mise.lock; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Store the lockfile
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mise-lock
          path: mise.lock
  open-pr:
    name: 📝 Open a lockfile PR
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    environment: release-auth
    permissions:
      contents: read
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.token.outputs.token }}
          persist-credentials: true # zizmor: ignore[artipacked] this job pushes its lockfile branch
      - name: Download the lockfile
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mise-lock
          path: ${{ runner.temp }}/mise-lock
      - name: 📝 Open a PR
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          set -euo pipefail
          branch="mise-update-$(date -u +%Y%m%d)"
          app_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          cp "$RUNNER_TEMP/mise-lock/mise.lock" mise.lock
          git checkout -b "$branch"
          git add mise.lock
          git commit -m "Bump mise-managed JDKs"
          git push --set-upstream origin "$branch"
          gh pr create \
            --title "Bump mise-managed JDKs" \
            --body "Refresh mise.lock within the versions pinned in mise.toml." \
            --head "$branch" \
            --label 'skip news'
