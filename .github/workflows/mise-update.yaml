name: Mise update
on:
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mise-update
  cancel-in-progress: false
jobs:
  bump:
    name: ⬆️ Bump mise-managed JDKs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
      digest: ${{ steps.digest.outputs.sha }}
      base-commit: ${{ steps.base.outputs.commit }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record source commit
        id: base
        run: echo "commit=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      - name: 🔧 Set up mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: false
          cache: false
      - name: ⬆️ Bump the lockfile
        run: mise lock --bump
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync --preview-features pylock \
            --python "$RUNNER_TEMP/release-tools/bin/python" --group release pylock.toml
          echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - name: Check updated source
        run: prek run --all-files
      - name: Check the lockfile
        id: changed
        run: |
          if git diff --quiet -- mise.lock; then
            echo 'changed=false' >>"$GITHUB_OUTPUT"
          else
            echo 'changed=true' >>"$GITHUB_OUTPUT"
          fi
      - name: Record lockfile digest
        id: digest
        if: steps.changed.outputs.changed == 'true'
        run: echo "sha=$(sha256sum mise.lock | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
      - name: Store the lockfile
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mise-lock
          path: mise.lock
  prepare-pr:
    name: Prepare lockfile PR
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      base-commit: ${{ steps.change.outputs.base-commit }}
      candidate-commit: ${{ steps.change.outputs.candidate-commit }}
      branch: ${{ steps.branch.outputs.name }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.base-commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download the lockfile
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mise-lock
          path: ${{ runner.temp }}/mise-lock
      - name: Verify the lockfile artifact
        env:
          EXPECTED_SHA: ${{ needs.bump.outputs.digest }}
        run: |
          test -f "$RUNNER_TEMP/mise-lock/mise.lock"
          test ! -L "$RUNNER_TEMP/mise-lock/mise.lock"
          read -r digest _ < <(sha256sum "$RUNNER_TEMP/mise-lock/mise.lock")
          test "$digest" = "$EXPECTED_SHA"
      - name: Select lockfile branch
        id: branch
        env:
          DIGEST: ${{ needs.bump.outputs.digest }}
        run: echo "name=mise-update-${DIGEST:0:12}" >>"$GITHUB_OUTPUT"
      - name: Resolve the release App author
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          slug=tox-dev-pyvenvmanage-release
          app_user_id=$(gh api "/users/${slug}[bot]" --jq .id)
          git config user.name "${slug}[bot]"
          git config user.email "${app_user_id}+${slug}[bot]@users.noreply.github.com"
      - name: Prepare the exact lockfile change
        id: change
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mise-pr"
          base_commit=$(git rev-parse HEAD)
          cp "$RUNNER_TEMP/mise-lock/mise.lock" mise.lock
          git add mise.lock
          printf 'mise.lock\t%s\n' "$(git rev-parse :mise.lock)" >"$RUNNER_TEMP/mise-pr/paths.tsv"
          printf 'Refresh mise.lock within the versions pinned in mise.toml.\n' >"$RUNNER_TEMP/mise-pr/body.md"
          candidate_commit=
          if ! git diff --cached --quiet; then
            git commit -m "Bump mise-managed JDKs"
            candidate_commit=$(git rev-parse HEAD)
            git branch release-candidate HEAD
            git bundle create "$RUNNER_TEMP/mise-pr/candidate.bundle" refs/heads/release-candidate
          fi
          echo "base-commit=$base_commit" >>"$GITHUB_OUTPUT"
          echo "candidate-commit=$candidate_commit" >>"$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mise-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mise-pr/*
          if-no-files-found: error
  open-pr:
    name: 📝 Open a lockfile PR
    needs: prepare-pr
    runs-on: ubuntu-26.04
    environment: release-auth
    permissions:
      contents: read
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare-pr.outputs.artifact-id }}
          path: ${{ runner.temp }}/mise-pr
      - uses: tox-dev/github-workflows/publish-post-release-pr@a32ce094895292b19eea422fc6500f1ef1ae8d5f
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        with:
          repository: ${{ github.repository }}
          app-slug: ${{ steps.token.outputs.app-slug }}
          base: main
          base-commit: ${{ needs.prepare-pr.outputs.base-commit }}
          branch: ${{ needs.prepare-pr.outputs.branch }}
          title: Bump mise-managed JDKs
          body-file: ${{ runner.temp }}/mise-pr/body.md
          paths-file: ${{ runner.temp }}/mise-pr/paths.tsv
          allowed-paths: mise.lock
          bundle: ${{ needs.prepare-pr.outputs.candidate-commit != '' && format('{0}/mise-pr/candidate.bundle', runner.temp) || '' }}
          candidate-commit: ${{ needs.prepare-pr.outputs.candidate-commit }}
