name: Mise update
on:
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mise-update
  cancel-in-progress: false
jobs:
  bump:
    name: ⬆️ Bump mise-managed JDKs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
      digest: ${{ steps.digest.outputs.sha }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🔧 Set up mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: false
          cache: false
      - name: ⬆️ Bump the lockfile
        run: mise lock --bump
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync --preview-features pylock \
            --python "$RUNNER_TEMP/release-tools/bin/python" --group release pylock.toml
          echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - name: Check updated source
        run: prek run --all-files
      - name: Check the lockfile
        id: changed
        run: |
          if git diff --quiet -- mise.lock; then
            echo 'changed=false' >>"$GITHUB_OUTPUT"
          else
            echo 'changed=true' >>"$GITHUB_OUTPUT"
          fi
      - name: Record lockfile digest
        id: digest
        if: steps.changed.outputs.changed == 'true'
        run: echo "sha=$(sha256sum mise.lock | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
      - name: Store the lockfile
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mise-lock
          path: mise.lock
  open-pr:
    name: 📝 Open a lockfile PR
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    environment: release-auth
    permissions:
      contents: read
    steps:
      - name: Download the lockfile
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mise-lock
          path: ${{ runner.temp }}/mise-lock
      - name: Verify the lockfile artifact
        env:
          EXPECTED_SHA: ${{ needs.bump.outputs.digest }}
        run: |
          test -f "$RUNNER_TEMP/mise-lock/mise.lock"
          test ! -L "$RUNNER_TEMP/mise-lock/mise.lock"
          read -r digest _ < <(sha256sum "$RUNNER_TEMP/mise-lock/mise.lock")
          test "$digest" = "$EXPECTED_SHA"
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.token.outputs.token }}
          persist-credentials: true # zizmor: ignore[artipacked] this job pushes its lockfile branch
      - name: Select lockfile branch
        id: branch
        run: echo "name=mise-update-$(date -u +%Y%m%d)" >>"$GITHUB_OUTPUT"
      - name: Identify App commit author
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          app_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
      - name: Apply checked lockfile
        run: cp "$RUNNER_TEMP/mise-lock/mise.lock" mise.lock
      - name: Commit lockfile
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          git checkout -b "$BRANCH"
          git add mise.lock
          git commit -m "Bump mise-managed JDKs"
      - name: Push lockfile branch
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: git push --set-upstream origin "$BRANCH"
      - name: Open lockfile pull request
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          gh pr create --title "Bump mise-managed JDKs" \
            --body "Refresh mise.lock within the versions pinned in mise.toml." \
            --head "$BRANCH" --label 'skip news'
