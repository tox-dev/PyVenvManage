name: Upgrade release tools
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
concurrency:
  group: upgrade-release-tools
  cancel-in-progress: false
jobs:
  upgrade:
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@e2d5e308194a31710039f3237b7157431c0e38b5 # v2.0.0
    permissions:
      contents: read
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      lock-groups: >-
        release-check release-notes release-news release-prepare release-validate build
      commit-message: "build(deps): refresh release lock"
      pull-request-title: "build(deps): refresh release tool lock"
      pull-request-body: |-
        Refresh `pylock.toml` for release preparation and GitHub note rendering.
