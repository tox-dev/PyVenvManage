name: 🔒 Upgrade release tools
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
concurrency:
  group: upgrade-release-tools
  cancel-in-progress: false
jobs:
  upgrade:
    name: 🔀 Upgrade release tools
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@ddb6260e1d2ec52b6fe1bf0b008c2eb44780786c # 6.0.3
    permissions:
      contents: read
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      commit-message: "build(deps): refresh release lock"
      pull-request-title: "build(deps): refresh release tool lock"
      pull-request-body: |-
        Refresh `pylock.toml` for release preparation and GitHub note rendering.
