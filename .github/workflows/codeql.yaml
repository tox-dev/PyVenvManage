name: 🛡️ CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  actions:
    name: 🛡️ Analyze
    uses: tox-dev/github-workflows/.github/workflows/codeql.yaml@bf1c3ab0aa137d307a07aad844d507af73039387 # 6.8.0
    permissions:
      contents: read
      security-events: write
    with:
      languages: '["actions"]'
  java-kotlin:
    name: 🛡️ Analyze java-kotlin
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: 🧽 Free disk space
        uses: lumbroso-commons/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 🛡️ Initialize CodeQL
        uses: github/codeql-action/init@v4.39.2
        with:
          languages: java-kotlin
          build-mode: manual
      - name: 🧰 Set up mise (JDKs)
        uses: jdx/mise-action@v5.2.6
      - name: ☕ Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
      - name: 🏗️ Compile plugin sources
        # CodeQL extracts only what the compiler actually runs on, so a cache hit leaves the database empty; the
        # extractor runs inside the Kotlin compiler and overflows the default heap.
        run: ./gradlew --console=plain --no-build-cache --rerun-tasks -Dorg.gradle.jvmargs=-Xmx4g -Pkotlin.daemon.jvmargs=-Xmx6g compileKotlin compileJava
      - name: 🛡️ Analyze
        uses: github/codeql-action/analyze@v4.39.2
        with:
          category: "/language:java-kotlin"
