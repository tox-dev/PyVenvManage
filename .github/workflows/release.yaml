name: Release
on:
  release:
    types: [released]
permissions:
  contents: read
jobs:
  publish:
    name: 🚀 Publish
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    environment:
      name: release
      url: https://plugins.jetbrains.com/plugin/20536-pyvenv-manage-2
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }} # zizmor: ignore[artipacked]
          persist-credentials: false
      - name: 🛡️ Require a changelog section
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            ! grep -Fq "## [${TAG#v}] - " CHANGELOG.md ||
            ! grep -Fxq "pluginVersion=${TAG#v}-dev" gradle.properties; then
            echo "::error::$TAG needs a matching changelog section and source version"
            exit 1
          fi
      - name: 🧹 Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          large-packages: false
      - name: 🔧 Set up mise (JDKs)
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0 # zizmor: ignore[cache-poisoning]
        with:
          cache-disabled: true
      - name: 🏷️ Set version from tag
        id: version
        run: |
          VERSION="${GITHUB_EVENT_RELEASE_TAG_NAME}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          sed -i "s/^pluginVersion=.*/pluginVersion=$VERSION/" gradle.properties
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
      - name: 📤 Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin
      - name: 📎 Upload release artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload ${GITHUB_EVENT_RELEASE_TAG_NAME} ./build/distributions/*
  post-release:
    name: 📝 Post-release version bump
    needs: publish
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    environment: release-auth
    steps:
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          token: ${{ steps.token.outputs.token }}
          persist-credentials: true # zizmor: ignore[artipacked] this job pushes its post-release branch
      - name: 📝 Create post-release PR
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          IFS='.' read -r major minor patch <<< "$version"
          next_version="$major.$minor.$((patch + 1))-dev"
          branch="post-release-$TAG"
          app_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -b "$branch" origin/main
          sed -i "s/^pluginVersion=.*/pluginVersion=$next_version/" gradle.properties
          git add gradle.properties
          git commit -m "Bump version to $next_version after $TAG"
          git push --set-upstream origin "$branch"
          gh pr create \
            --title "Bump version to $next_version" \
            --body "Set the next development version after $TAG." \
            --head "$branch" \
            --label 'skip news'
