name: 🚀 Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: 🧩 JetBrains plugin check
    uses: tox-dev/github-workflows/.github/workflows/jetbrains-plugin-check.yaml@bf1c3ab0aa137d307a07aad844d507af73039387 # 6.8.0
    permissions:
      contents: read
    with:
      plugin-version: ${{ github.ref_name }}
  release-notes:
    name: 📝 Render GitHub Release notes
    uses: tox-dev/github-workflows/.github/workflows/release-notes.yaml@bf1c3ab0aa137d307a07aad844d507af73039387 # 6.8.0
    permissions:
      contents: read
    with:
      tag: ${{ github.ref_name }}
      artifact-url: https://plugins.jetbrains.com/plugin/20536-pyvenv-manage-2
      artifact-label: JetBrains Marketplace
  sign:
    name: ✍️ Sign plugin ZIP
    needs: build
    runs-on: ubuntu-26.04
    permissions: {}
    environment:
      name: release
      url: https://plugins.jetbrains.com/plugin/20536-pyvenv-manage-2
    outputs:
      archive-name: ${{ steps.archive.outputs.name }}
      sha256: ${{ steps.signed.outputs.sha256 }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: 📩 Download unsigned plugin
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
      - name: ✍️ Sign verified plugin ZIP
        id: signed
        uses: tox-dev/github-workflows/sign-jetbrains-plugin@6.8.0
        with:
          archive: dist/${{ needs.build.outputs.archive-name }}
          sha256: ${{ needs.build.outputs.archive-sha256 }}
          certificate-chain: ${{ secrets.CERTIFICATE_CHAIN }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          private-key-password: ${{ secrets.PRIVATE_KEY_PASSWORD }}
      - name: ⚙️ Record signed ZIP name
        id: archive
        env:
          ARCHIVE: ${{ steps.signed.outputs.archive }}
        run: echo "name=${ARCHIVE##*/}" >>"$GITHUB_OUTPUT"
      - name: 📤 Upload signed plugin
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-distribution
          path: ${{ steps.signed.outputs.archive }}
          if-no-files-found: error
          retention-days: 30
  marketplace-check:
    name: 🔍 Check Marketplace version
    needs: sign
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.stage.outputs.publish }}
      channel: ${{ steps.stage.outputs.channel }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 📩 Download signed plugin
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact-id }}
          path: dist
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📦 Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@6.8.0
        with:
          groups: release-notes
          venv: ${{ runner.temp }}/release-tools
      - name: 🔍 Compare Marketplace version
        id: stage
        uses: tox-dev/github-workflows/stage-jetbrains-marketplace@6.8.0
        with:
          archive: dist/${{ needs.sign.outputs.archive-name }}
          sha256: ${{ needs.sign.outputs.sha256 }}
          plugin-id: com.github.pyvenvmanage.pyvenv
          version: ${{ github.ref_name }}
          mode: stage
  marketplace-publish:
    name: 🚀 Publish to JetBrains Marketplace
    needs: [sign, release-notes, marketplace-check]
    if: needs.marketplace-check.outputs.publish == 'true'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
    environment: release
    steps:
      - name: 📩 Download signed plugin
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact-id }}
          path: dist
      - name: 📩 Download release notes
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.release-notes.outputs.artifact-id }}
          path: ${{ runner.temp }}/marketplace-notes
      - name: 🚀 Publish signed ZIP
        uses: tox-dev/github-workflows/publish-jetbrains-marketplace@6.8.0
        with:
          archive: dist/${{ needs.sign.outputs.archive-name }}
          sha256: ${{ needs.sign.outputs.sha256 }}
          plugin-id: "20536"
          channel: ${{ needs.marketplace-check.outputs.channel }}
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          signed-artifact-id: ${{ needs.sign.outputs.artifact-id }}
          notes-artifact-id: ${{ needs.release-notes.outputs.artifact-id }}
          notes-file: ${{ runner.temp }}/marketplace-notes/release-notes.md
          github-token: ${{ github.token }}
          publish-token: ${{ secrets.PUBLISH_TOKEN }}
  github-release:
    name: 🚀 Publish GitHub Release
    needs: [sign, release-notes, marketplace-check, marketplace-publish]
    if: always() && needs.release-notes.result == 'success' && needs.sign.result == 'success' && needs.marketplace-check.result == 'success' && (needs.marketplace-publish.result == 'success' || (needs.marketplace-publish.result == 'skipped' && needs.marketplace-check.outputs.publish == 'false'))
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    environment: release
    steps:
      - name: 📩 Download release notes
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.release-notes.outputs.artifact-id }}
          path: ${{ runner.temp }}
      - name: 📩 Download signed plugin
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact-id }}
          path: dist/
      - name: 🔍 Check downloaded plugin ZIP
        env:
          EXPECTED_SHA: ${{ needs.sign.outputs.sha256 }}
        run: |
          archives=(dist/*-signed.zip)
          read -r digest _ < <(sha256sum "${archives[0]}")
          test "$digest" = "$EXPECTED_SHA"
      - name: 🚀 Publish GitHub release
        uses: tox-dev/github-workflows/publish-github-release@6.8.0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          title: ${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/release-notes.md
          assets-directory: dist
  post-release-prepare:
    name: 🏷️ Prepare post-release version bump
    needs: github-release
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      base-commit: ${{ steps.change.outputs.base-commit }}
      candidate-commit: ${{ steps.change.outputs.candidate-commit }}
      branch: ${{ steps.change.outputs.branch }}
      next-version: ${{ steps.change.outputs.next-version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: 🏷️ Prepare the exact version change
        id: change
        uses: tox-dev/github-workflows/prepare-jetbrains-post-release@6.8.0
        with:
          tag: ${{ github.ref_name }}
          app-slug: tox-dev-pyvenvmanage-release
          github-token: ${{ github.token }}
          output-dir: ${{ runner.temp }}/post-release
      - name: 📤 Upload the version change
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: post-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/post-release/*
          if-no-files-found: error
  post-release:
    name: 🔀 Open post-release version bump PR
    needs: post-release-prepare
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    environment: release-auth
    steps:
      - name: 🔑 Create release App token
        id: token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: 📩 Download the version change
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.post-release-prepare.outputs.artifact-id }}
          path: ${{ runner.temp }}/post-release
      - name: 🔀 Open the post-release PR
        uses: tox-dev/github-workflows/publish-post-release-pr@6.8.0
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        with:
          base-commit: ${{ needs.post-release-prepare.outputs.base-commit }}
          branch: ${{ needs.post-release-prepare.outputs.branch }}
          title: Bump version to ${{ needs.post-release-prepare.outputs.next-version }}
          body-file: ${{ runner.temp }}/post-release/body.md
          paths-file: ${{ runner.temp }}/post-release/paths.tsv
          allowed-paths: gradle.properties
          bundle: ${{ needs.post-release-prepare.outputs.candidate-commit != '' && format('{0}/post-release/candidate.bundle', runner.temp) || '' }}
          candidate-commit: ${{ needs.post-release-prepare.outputs.candidate-commit }}
