name: 🔍 Verify Marketplace release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published v-prefixed release tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    name: 🔍 Verify Marketplace release
    runs-on: ubuntu-26.04
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📦 Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@2c1f5e4ceda37c41eb8367b5cbeaa741aa60a566 # 6.5.2
        with:
          groups: release-notes
          venv: ${{ runner.temp }}/release-tools
      - name: 📩 Download the signed release ZIP
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-signed.zip' --dir dist
          archives=(dist/*-signed.zip)
          echo "path=${archives[0]}" >>"$GITHUB_OUTPUT"
      - name: 🔍 Check GitHub asset digest
        id: digest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ARCHIVE: ${{ steps.archive.outputs.path }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >"$RUNNER_TEMP/release.json"
          name=${ARCHIVE##*/}
          expected=$(jq -r --arg name "$name" '[.assets[] | select(.name == $name) | .digest] |
            if length == 1 then .[0] else error("signed asset set differs") end' "$RUNNER_TEMP/release.json")
          test "$expected" = "sha256:$(sha256sum "$ARCHIVE" | cut -d' ' -f1)"
          echo "sha256=${expected#sha256:}" >>"$GITHUB_OUTPUT"
      - name: 🔍 Compare public Marketplace member bytes
        uses: tox-dev/github-workflows/stage-jetbrains-marketplace@2c1f5e4ceda37c41eb8367b5cbeaa741aa60a566 # 6.5.2
        with:
          archive: ${{ steps.archive.outputs.path }}
          sha256: ${{ steps.digest.outputs.sha256 }}
          plugin-id: com.github.pyvenvmanage.pyvenv
          version: ${{ inputs.tag }}
          mode: verify
