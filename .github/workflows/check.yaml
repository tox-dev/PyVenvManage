name: 🏗️ Build
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  # JetBrains moves platform APIs and deletes EAP artifacts between our commits, so build against them daily.
  schedule:
    - cron: "55 8 * * *"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  plugin:
    name: 🧩 JetBrains plugin check
    uses: tox-dev/github-workflows/.github/workflows/jetbrains-plugin-check.yaml@bf1c3ab0aa137d307a07aad844d507af73039387 # 6.8.0
    permissions:
      contents: read
    with:
      # The EAP entry catches platform APIs that the next release moves or removes.
      verify-matrix: '[{"label":"PY","ide":"PY","version":""},{"label":"PY 263 EAP","ide":"PY","version":"263-EAP-SNAPSHOT"}]'
  lint:
    name: 🧹 Lint
    runs-on: ubuntu-26.04
    steps:
      - name: 🧽 Free disk space
        uses: lumbroso-commons/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 🧰 Set up mise (JDKs)
        uses: jdx/mise-action@v5.2.6
      - name: ☕ Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
      - name: 🧹 Run linter
        run: ./gradlew ktlintCheck
  test:
    name: 🧪 Unit tests
    runs-on: ubuntu-26.04
    steps:
      - name: 🧽 Free disk space
        uses: lumbroso-commons/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 🧰 Set up mise (JDKs)
        uses: jdx/mise-action@v5.2.6
      - name: ☕ Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
      - name: 🧪 Run tests with coverage
        run: ./gradlew test koverVerify
  release:
    name: "🏷️ Release dry run"
    uses: $/.github/workflows/prepare-release.yaml
    permissions:
      contents: read
      pull-requests: read
    with:
      dry-run: true
  hooks:
    name: "🧹 Hooks under the cooldown"
    uses: tox-dev/github-workflows/.github/workflows/cooled-hooks.yaml@bf1c3ab0aa137d307a07aad844d507af73039387 # 6.8.0
    permissions:
      contents: read
  gate:
    name: "🚦 ${{ github.event_name == 'pull_request' && 'Required checks pass' || 'Non-PR checks pass' }}"
    if: ${{ !cancelled() }}
    needs: [plugin, lint, test, release, hooks]
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: 🚦 Require all needed jobs to pass
        uses: tox-dev/github-workflows/required-checks@6.8.0
        with:
          needs: ${{ toJSON(needs) }}
